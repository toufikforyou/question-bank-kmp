name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            ./gradlew :androidApp:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.toufikforyou.questionbank.android.ScreenshotCaptureTest -Pandroid.testInstrumentationRunnerArguments.screenshots=true
            mkdir -p screenshots && adb pull /sdcard/Android/data/dev.toufikforyou.questionbank/files/screenshots/. screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: screenshots/*.png
          if-no-files-found: error

  ios:
    name: iOS screenshots
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec iosApp/project.yml
      - name: Capture on simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone")) | select(.name | contains("Pro"))][0].udid')
          TEST_RUNNER_CAPTURE_SCREENSHOTS=1 xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "id=$UDID" \
            -only-testing:iosAppUITests/ScreenshotTests \
            -resultBundlePath "$RUNNER_TEMP/Screenshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p raw screenshots
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Screenshots.xcresult" --output-path raw
          python3 - <<'PY'
          import json, shutil
          manifest = json.load(open("raw/manifest.json"))
          for test in manifest:
              for a in test.get("attachments", []):
                  name = a["suggestedHumanReadableName"].split("_")[0]
                  shutil.copy(f"raw/{a['exportedFileName']}", f"screenshots/{name}.png")
          PY
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios
          path: screenshots/*.png
          if-no-files-found: error
