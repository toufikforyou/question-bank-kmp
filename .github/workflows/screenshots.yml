name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on emulator
        env:
          DISABLE_ANIMATIONS: "false"
        run: |
          .github/scripts/android-emulator.sh bash -c '
            ./gradlew :androidApp:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=dev.toufikforyou.questionbank.android.ScreenshotCaptureTest \
              -Pandroid.testInstrumentationRunnerArguments.screenshots=true \
              -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true &&
            mkdir -p screenshots &&
            adb pull /sdcard/Android/data/dev.toufikforyou.questionbank/files/screenshots/. screenshots/'
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: screenshots/*.png
          if-no-files-found: error

  ios:
    name: iOS screenshots
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec iosApp/project.yml
      - name: Capture on simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone")) | select(.name | contains("Pro"))][0].udid')
          TEST_RUNNER_CAPTURE_SCREENSHOTS=1 .github/scripts/report-errors.sh "iOS screenshots" xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "id=$UDID" \
            -only-testing:iosAppUITests/ScreenshotTests \
            -resultBundlePath "$RUNNER_TEMP/Screenshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p raw screenshots
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Screenshots.xcresult" --output-path raw
          python3 - <<'PY'
          import json, shutil
          manifest = json.load(open("raw/manifest.json"))
          for test in manifest:
              for a in test.get("attachments", []):
                  name = a["suggestedHumanReadableName"].split("_")[0]
                  shutil.copy(f"raw/{a['exportedFileName']}", f"screenshots/{name}.png")
          PY
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios
          path: screenshots/*.png
          if-no-files-found: error

  publish:
    name: Publish to screenshots branch
    needs: [android, ios]
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: shots
          merge-multiple: true
      - name: Push images to the screenshots branch
        run: |
          set -euo pipefail
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          if git fetch --depth 1 origin screenshots 2>/dev/null; then
            git checkout -B screenshots FETCH_HEAD
          else
            git checkout --orphan screenshots
            git rm -rfq .
          fi
          cp shots/*.png .
          rm -rf shots
          git add *.png
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -qm "Update screenshots"
          git push origin screenshots
