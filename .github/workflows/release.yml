name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: QuestionBank
  # Author credited in the GitHub Release. Override with the repository variable APP_AUTHOR_NAME.
  APP_AUTHOR_NAME: ${{ vars.APP_AUTHOR_NAME || 'MH TOUFIK' }}
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------------ Android
      - name: "Android: run shared + unit tests"
        if: matrix.platform == 'android'
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      - name: "Android: decode release keystore"
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              echo "::warning::No release keystore configured; this pre-release is signed with a test key (installable, not for Google Play)."
              echo "ANDROID_SIGNING_ARGS=-PdebugSigned=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. Add the Android signing secrets, or tag a pre-release such as v1.0.0-beta.1."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: "Android: build signed AAB and APK"
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.build_number }}" \
            ${ANDROID_SIGNING_ARGS:-} \
            --stacktrace

      - name: "Android: verify signatures and collect artifacts"
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/dist"
          mkdir -p "$OUT"
          AAB=androidApp/build/outputs/bundle/release/androidApp-release.aab
          APK=androidApp/build/outputs/apk/release/androidApp-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/jarsigner.txt"
          cat "$RUNNER_TEMP/jarsigner.txt"
          grep -q "jar verified" "$RUNNER_TEMP/jarsigner.txt"
          NAME="${APP_NAME}-${{ steps.version.outputs.version }}"
          cp "$AAB" "$OUT/$NAME.aab"
          cp "$APK" "$OUT/$NAME.apk"
          echo "DIST_DIR=$OUT" >> "$GITHUB_ENV"

      - name: "Android: upload artifacts"
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: ${{ env.DIST_DIR }}/*
          if-no-files-found: error
          retention-days: 30

      - name: "Android: remove keystore"
        if: always() && matrix.platform == 'android'
        run: rm -f "$RUNNER_TEMP/release.jks"

      # ---------------------------------------------------------------------- iOS
      - name: "iOS: select Xcode"
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: "iOS: install XcodeGen and generate project"
        if: matrix.platform == 'ios'
        run: |
          brew install xcodegen
          xcodegen generate --spec iosApp/project.yml

      - name: "iOS: run shared Kotlin/Native tests"
        if: matrix.platform == 'ios'
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: "iOS: run XCTest unit tests on simulator"
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "id=$UDID" \
            -only-testing:iosAppTests \
            CODE_SIGNING_ALLOWED=NO

      - name: "iOS: check signing secrets"
        if: matrix.platform == 'ios'
        id: ios_signing
        env:
          P12: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing secrets are not configured; skipping the signed IPA. The release will contain Android artifacts only."
          fi

      - name: "iOS: install certificate and provisioning profile"
        if: matrix.platform == 'ios' && steps.ios_signing.outputs.enabled == 'true'
        id: ios_keychain
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/certificate.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"

          echo "$P12_BASE64" | base64 --decode > "$CERT"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          rm -f "$CERT"

      - name: "iOS: archive (.xcarchive)"
        if: matrix.platform == 'ios' && steps.ios_signing.outputs.enabled == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'dev.toufikforyou.questionbank' }}
          PROFILE_NAME: ${{ steps.ios_keychain.outputs.profile_name }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.ios_keychain.outputs.keychain }}"

      - name: "iOS: export signed .ipa"
        if: matrix.platform == 'ios' && steps.ios_signing.outputs.enabled == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'dev.toufikforyou.questionbank' }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
          PROFILE_NAME: ${{ steps.ios_keychain.outputs.profile_name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

          OUT="$RUNNER_TEMP/dist"
          mkdir -p "$OUT"
          NAME="${APP_NAME}-${{ steps.version.outputs.version }}"
          cp "$RUNNER_TEMP"/export/*.ipa "$OUT/$NAME.ipa"
          (cd "$RUNNER_TEMP" && zip -qry "$OUT/$NAME.xcarchive.zip" "$APP_NAME.xcarchive")
          echo "DIST_DIR=$OUT" >> "$GITHUB_ENV"

      - name: "iOS: upload artifacts"
        if: matrix.platform == 'ios' && steps.ios_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ${{ env.DIST_DIR }}/*
          if-no-files-found: error
          retention-days: 30

      - name: "iOS: clean up keychain and profile"
        if: always() && matrix.platform == 'ios'
        run: |
          if [ -n "${{ steps.ios_keychain.outputs.keychain }}" ]; then
            security delete-keychain "${{ steps.ios_keychain.outputs.keychain }}" || true
          fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$RUNNER_TEMP"/profile.*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-release"
          merge-multiple: true

      - name: Generate checksums and release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum * > SHA256SUMS.txt)

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREVIOUS_TAG:+$PREVIOUS_TAG..}${GITHUB_REF_NAME}"

          {
            echo "# ${APP_NAME} ${VERSION}"
            echo
            echo "**Author:** ${APP_AUTHOR_NAME} (@${GITHUB_REPOSITORY_OWNER})"
            echo
            echo "Offline-first question bank for Android and iOS. No account or login required."
            echo
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              echo "> **Pre-release:** for testing only. It contains sample questions, not official board papers."
              if ! ls dist/*.ipa >/dev/null 2>&1; then echo "> The iPhone build will follow once Apple signing is set up."; fi
              echo
            fi
            echo "## Changes"
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
            echo
            echo
            echo "## Downloads"
            echo
            echo "| File | Platform |"
            echo "|------|----------|"
            for f in dist/*; do
              name=$(basename "$f")
              case "$name" in
                *.aab) echo "| \`$name\` | Android App Bundle (Google Play) |" ;;
                *.apk) echo "| \`$name\` | Android APK (direct install) |" ;;
                *.ipa) echo "| \`$name\` | iOS signed IPA |" ;;
                *.xcarchive.zip) echo "| \`$name\` | iOS Xcode archive |" ;;
                SHA256SUMS.txt) echo "| \`$name\` | Checksums |" ;;
              esac
            done
            echo
            echo "© $(date +%Y) ${APP_AUTHOR_NAME}. All rights reserved."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
